name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Install build tool
        if: matrix.python == '3.14'
        run: python -m pip install pyinstaller==6.20.0
      - name: Build console manager
        if: matrix.python == '3.14'
        run: python -m PyInstaller --onefile --console --name ai-multi-instance --clean --noconfirm main.py
      - name: Build shortcut launcher
        if: matrix.python == '3.14'
        run: python -m PyInstaller --onefile --noconsole --name launcher --clean --noconfirm launcher.pyw
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.14'
        with:
          name: ai-multi-instance-windows
          path: |
            dist/ai-multi-instance.exe
            dist/launcher.exe
          if-no-files-found: error
          retention-days: 14
